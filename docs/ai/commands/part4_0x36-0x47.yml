- opcode: 0x36
  macro: AICMD0x36_UpdateDog
  handler: fAIAction0x36_UpdateDog
  handler_addr: "84AF06"
  suggested_name: UpdateDog
  confidence: probable
  length_bytes: 1
  params: []
  summary: "One tick of the dog logic: copies the AI slot position to nDogX/nDogY, handles hugging/picking up the dog, random idle behaviors and running to the player after a whistle."
  details: "The handler advances ptrAIActionData by 1 (the next command is usually a Jump back to UpdateDog - see B38DAC/B38DAD, so a loop). It copies the AI slot words ([ptrAIUnknown0xCC]+0x1A and +0x1C) to nDogX/nDogY. (1) Hug: if slot byte +0x0C != 0 and the player is NOT: using a tool / showing a tool / whistling for the horse or dog / eating a meal / riding a horse / in action $17 or ITEMONHAND / carrying an item (carryItemId), the flag daily4 $0006 is clear, A is newly pressed (strcJoypad1.newInput) and there is no PFLAGS_DOGHUGGING, then it clears slot byte +0x00 (slot deactivation), sets bit $40 in +0x01, sets PFLAGS_DOGHUGGING and increments nDogHugs. (2) Idle: strcStockData.unkDog counts frames up to $78 (120), then is cleared and a state machine in $7F1F58 (bits $01,$02,$04,$08,$10, checked in that order) starts a dog subscript with a random chance (strcPlayer.lastRandomNumber) via fAI_SetSlotScript(A=$16, X=0, Y=$3C..$49) and changes the state; the random thresholds are e.g. $40/$80/$C0 for state $01, $2A/$54/$7E/$A8 for state $02. (3) Whistle (flag daily4 $0010, set in fPlayerAction0x1B_WhistleDog and cleared at the end of the fAI_DeactivateSlotAndObject-style routine): clears unkDog, sets bits $28 in +0x01, starts subscript Y=slot[+0x3F] (X=0), computes |dx|,|dy| between the slot and the player, sets [+0x08]=$20 and the movement direction in [+0x0F] as a bit mask (1=down,2=up,4=right,8=left - same order as aAIJoypadInput) according to the larger axis. At the end (if there was no whistle) it increments the counter [+0x10]. It does not block."
  ram_touched: [ptrAIActionData, ptrAIUnknown0xCC, nDogX, nDogY, nDogHugs, strcStockData.unkDog, "$7F1F58", strcPlayer.action, strcPlayer.flags, strcPlayer.lastRandomNumber, strcPlayer.posX, strcPlayer.posY, strcPlayerData.carryItemId, strcJoypad1.newInput, "strcFlags.daily4"]
  calls: [fAI_SetSlotScript]
  open_questions: "The meaning of the bits of state $7F1F58 (probably: 1=standing, 2=sitting/lying etc.), of the subscript indices $3C-$49, $3F and of slot bytes +0x08/+0x0C/+0x0F is not determined without analyzing the subscripts in B38xxx. It is not known whether byte +0x0C means 'the dog can be picked up' (inference only). To be confirmed whether one command is executed per frame per slot (in which case UpdateDog+Jump = a tick every 2 frames)."

