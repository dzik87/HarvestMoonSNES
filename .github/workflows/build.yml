name: build

on:
  push:
    branches: [main, overhaul]
  pull_request:
  workflow_dispatch:

jobs:
  build-us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache asar
        id: cache-asar
        uses: actions/cache@v4
        with:
          path: tools/bin/asar
          key: asar-${{ hashFiles('third_party/asar/src/**') }}-${{ runner.os }}

      - name: Build asar from the third_party/asar submodule
        if: steps.cache-asar.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          python3 tools/build_asar.py 2>&1 | tee asar-build.log

      - name: Asar build log (on failure)
        if: failure()
        run: |
          {
            echo "### asar build failure"
            echo '```'
            tail -n 40 asar-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate assets and assembly from sources (PNG/JSON/text -> .bin/.pal, build/gen/{dialogs,objects,maps})
        run: |
          pip install pillow
          python3 tools/build_assets.py

      - name: Check asset sources
        run: |
          python3 tools/gfx/palette.py check
          python3 tools/dialogs/dialog.py check
          python3 tools/maps/objmap.py check
          python3 tools/objects/objdata.py check
          python3 tools/data/bankbin.py check
          python3 tools/gfx/gfxpipe.py verify
          python3 tools/fonts/font.py check
          python3 tests/test_font.py
          python3 tests/test_spc700.py
          python3 tools/audio/audio_map.py --check
          python3 tools/audio/audioconv.py check
          python3 tests/test_audio_convert.py
          python3 tests/test_objdata.py
          python3 tools/objects/spriteexport.py export
          python3 tools/objects/spriteexport.py check
          python3 tests/test_spriteexport.py
          python3 tests/test_tilemap_codec.py
          python3 tests/test_disasm65816.py
          python3 tests/test_bytealign.py
          python3 tools/gfx/tiles.py selftest
          python3 tools/gfx/palette_map.py check
          python3 tools/gfx/pngsync.py check
          for R in eu de jp; do python3 tools/gfx/pngsync.py check --region $R; done
          python3 tests/test_pngsync.py
          python3 tests/test_ai_region.py
          python3 tests/test_region_patch.py

      - name: Build and verify (US)
        run: |
          set -o pipefail
          python3 tools/build.py --region US -v 2>&1 | tee build-us.log

      - name: Build and verify (DE, complete ROM)
        run: |
          set -o pipefail
          python3 tools/build.py --region DE --out build/HarvestMoonDE.sfc -v 2>&1 | tee build-de.log

      - name: Build and verify (EU, complete ROM)
        run: |
          set -o pipefail
          python3 tools/build.py --region EU --out build/HarvestMoonEU.sfc -v 2>&1 | tee build-eu.log

      - name: Build and verify (JP, complete ROM)
        run: |
          set -o pipefail
          python3 tools/build.py --region JP --out build/HarvestMoonJP.sfc -v 2>&1 | tee build-jp.log

      - name: Report result
        if: always()
        run: |
          MSG=$(tail -n 25 build-us.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=build-us log::${MSG}"
          for R in de eu jp; do
            MSGR=$(tail -n 18 build-$R.log 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=build-$R log::${MSGR}"
          done
          {
            for R in de eu jp; do
              echo "### Build ${R^^} (complete ROM)"
              echo '```'
              tail -n 18 build-$R.log 2>/dev/null || echo "no log"
              echo '```'
            done
            echo "### Build US"
            echo '```'
            tail -n 25 build-us.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HarvestMoon-US
          path: |
            build/HarvestMoon.sfc
            build-us.log
          if-no-files-found: ignore
