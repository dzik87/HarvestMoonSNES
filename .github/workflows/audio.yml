name: audio-render-check

# Smoke test of the audio pipeline: renders SPC snapshots and short MP3 copies of all songs and sound effects.
# Runs only when audio sources change (or by hand), never as part of the ROM build.
# The output is discarded: this workflow does not upload artifacts (artifact quota); listen locally, see docs/workflow.md.

on:
  push:
    branches: [main]
    paths:
      - 'assets/audio/**'
      - 'defs/audio/**'
      - 'tools/audio/**'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test audio tools
        run: python3 tests/test_audio_convert.py

      - name: Generate SPC snapshots (songs and SFX)
        run: |
          python3 tools/audio/audioconv.py spc --all --out build/listen/spc
          python3 tools/audio/audioconv.py spc --out build/listen/spc $(seq 1 49 | sed 's/^/--sfx /')

      - name: Render MP3
        run: python3 tools/audio/audioconv.py render build/listen/spc --out build/listen/mp3 --format mp3 --seconds 10
